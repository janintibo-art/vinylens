name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Erreurs de compilation
        if: failure()
        run: |
          echo "================= ERREURS KOTLIN ================="
          grep -E "^e: |^ERROR|error:" build.log | head -40 || echo "(aucune ligne d'erreur isolee)"
          echo "================================================="


      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk vinylens-${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vinylens-apk
          path: vinylens-${{ github.run_number }}.apk

      - name: Publish release (APK téléchargeable directement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VinyLens build ${{ github.run_number }}
          files: vinylens-${{ github.run_number }}.apk
